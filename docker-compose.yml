#version: '3.8'

services:
  # === База данных PostgreSQL ===
  db:
    image: postgres:15-alpine
    container_name: maxbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-maxbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DB_NAME:-maxbot_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - maxbot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-maxbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Бот ===
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maxbot_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-maxbot}
      - DB_PASSWORD=${DB_PASSWORD:-secretpassword}
      - DB_NAME=${DB_NAME:-maxbot_db}
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WEBHOOK_HOST=${WEBHOOK_HOST:-}
      - METRICS_ADDR=${METRICS_ADDR:-:9090}
      - ENABLE_CACHE=${ENABLE_CACHE:-false}
    ports:
      - "${METRICS_PORT:-9090}:9090"  # Метрики (опционально)
      - "${WEBHOOK_PORT:-8080}:8080"  # Webhook (если используется)
    networks:
      - maxbot_network
    volumes:
      - ./configs:/root/configs:ro
      - ./logs:/root/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# === Сети ===
networks:
  maxbot_network:
    driver: bridge

# === Тома ===
volumes:
  pgdata:
    driver: local